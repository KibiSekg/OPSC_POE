name: Android CI (Build and Test)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment (Match your Android Studio Gradle JDK version)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # Options: zulu, temurin, corretto
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up future runs

      # 3. Grant execute permission to the Gradle wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Run Code Analysis & Style Checks (Linting)
      - name: Run Code Linting
        run: ./gradlew lintDebug

      # 5. Execute Local Unit Tests (JUnit & Mockito)
      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest

      # 6. Build the Debug APK to verify compilation
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      # 7. Upload the compiled APK as a build artifact (Optional)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
